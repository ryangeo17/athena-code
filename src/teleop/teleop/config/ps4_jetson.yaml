# PS4 controller profile — Jetson (rover onboard)
#
# On Jetson the DS4 driver reports axes differently:
#   - Left stick U/D (axis 1): NOT inverted  (opposite of desktop)
#   - Right stick U/D: axis 5  (desktop uses axis 4)
#   - L2/R2 trigger indices may also shift — verify with ros2 topic echo /joy
#
# TODO: verify all axis indices by running `ros2 topic echo /joy` on the Jetson
#       with a PS4 controller connected and confirm each axis matches below.

deadband: 0.08

axes:
  - { src: 0, invert: false, trigger: false }  # [0] left stick L/R
  - { src: 1, invert: false, trigger: false }  # [1] left stick U/D  (not inverted on Jetson)
  - { src: 3, invert: false, trigger: false }  # [2] right stick L/R
  - { src: 5, invert: true,  trigger: false }  # [3] right stick U/D (axis 5 on Jetson; TODO: confirm invert)
  - { src: 2, invert: false, trigger: true  }  # [4] L2 trigger       (TODO: confirm index)
  - { src: 4, invert: false, trigger: true  }  # [5] R2 trigger       (TODO: confirm index)

button_count: 13
