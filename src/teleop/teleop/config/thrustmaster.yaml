# Thrustmaster T.16000M profile
#
# Raw joy_node axes (Linux jsdev):
#   0: stick X   — reported with right=-1, left=+1; inverted here so output is left=-1, right=+1
#   1: stick Y   — fwd/back, orientation already correct
#   2: twist Z   — inverted so output is left=-1, right=+1 (matches REP-103 stick convention)
#   3: throttle slider
#   4: hat X     — inverted
#   5: hat Y
#
# Output layout (must match drive_bringup/config/teleop_twist.yaml axis indices):
#   [0] rotate    <- raw 2 inverted   (teleop_twist: axis_angular.yaw = 0)
#   [1] fwd/back  <- raw 1            (teleop_twist: axis_linear.x   = 1)
#   [2] l/r       <- raw 0 inverted   (teleop_twist: axis_linear.y   = 2, scale 0)
#   [3] slider    <- raw 3
#   [4] hat X     <- raw 4 inverted
#   [5] hat Y     <- raw 5

deadband: 0.08

axes:
  - { src: 2, invert: true,  trigger: false }  # [0] rotate
  - { src: 1, invert: false, trigger: false }  # [1] fwd/back
  - { src: 0, invert: true,  trigger: false }  # [2] l/r
  - { src: 3, invert: false, trigger: false }  # [3] slider
  - { src: 4, invert: true,  trigger: false }  # [4] hat X
  - { src: 5, invert: false, trigger: false }  # [5] hat Y

button_count: 16
