manual_arm_cylindrical_controller:
  joints: {
    type: string_array,
    default_value: [],
    description: "Specifies joints used by the controller. If state joints parameter is defined, then only command joints are defined with this parameter.",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  state_joints: {
    type: string_array,
    default_value: [],
    description: "(optional) Specifies joints for reading states. This parameter is only relevant when state joints are different then command joint, i.e., when a following controller is used.",
    read_only: true,
    validation: {
      unique<>: null,
    }
  }
  interface_name: {
    type: string,
    default_value: "",
    description: "Name of the interface used by the controller on joints and command_joints.",
    read_only: true,
    validation: {
      not_empty<>: null,
      one_of<>: [["position", "velocity", "acceleration", "effort",]],
      forbidden_interface_name_prefix: null
    }
  }
  joystick_topic: {
    type: string,
    default_value: "controller_input/xbox",
    description: "Topic name for joystick input (sensor_msgs/Joy).",
    read_only: true,
    validation: {
      not_empty<>: null,
    }
  }
  joint_lengths: {
    type: double_array,
    default_value: [],
    description: "Specifies joint lengths for calculation purposes. ",
    read_only: true,
    validation: {
      not_empty<>: null,
    }
  }
  # Controller: Xbox
  # Buttons: [1] B (thetadot modifier)
  # Axes:    [0] left_stick_lr  [1] left_stick_ud  [2] right_stick_lr  [3] right_stick_ud  [4] left_trigger  [5] right_trigger
  controls:
    thetadot_modifier_button: { type: int, default_value: 1, description: "Button index for thetadot modifier.", read_only: true }  # Xbox: B
    open_claw_axis:           { type: int, default_value: 4, description: "Axis index for open claw (analog).", read_only: true }   # Xbox: left_trigger
    close_claw_axis:          { type: int, default_value: 5, description: "Axis index for close claw (analog).", read_only: true }  # Xbox: right_trigger
    yaw_axis:                 { type: int, default_value: 2, description: "Axis index for yaw input.", read_only: true }            # Xbox: right_stick_lr
    vy_axis:                  { type: int, default_value: 1, description: "Axis index for vy (reach in/out).", read_only: true }    # Xbox: left_stick_ud
    vz_axis:                  { type: int, default_value: 3, description: "Axis index for vz / height.", read_only: true }          # Xbox: right_stick_ud
    wrist_roll_axis:          { type: int, default_value: 0, description: "Axis index for wrist roll.", read_only: true }           # Xbox: left_stick_lr
