manual_arm_joint_by_joint_controller:
  position_joints: {
    type: string_array,
    default_value: [],
    description: "Specifies joints which are controlled via position.",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  velocity_joints: {
    type: string_array,
    default_value: [],
    description: "Specifies joints which are controlled via velocity.",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  # state_joints: {
  #   type: string_array,
  #   default_value: [],
  #   description: "(optional) Specifies joints for reading states. This parameter is only relevant when state joints are different then command joint, i.e., when a following controller is used.",
  #   read_only: true,
  #   validation: {
  #     unique<>: null,
  #   }
  # }
  # interface_name: {
  #   type: string,
  #   default_value: "",
  #   description: "Name of the interface used by the controller on joints and command_joints.",
  #   read_only: true,
  #   validation: {
  #     not_empty<>: null,
  #     one_of<>: [["position", "velocity", "acceleration", "effort",]],
  #     forbidden_interface_name_prefix: null
  #   }
  # }
  joystick_topic: {
    type: string,
    default_value: "controller_input/airbus",
    description: "Topic name for joystick input (sensor_msgs/Joy).",
    read_only: true,
    validation: {
      not_empty<>: null,
    }
  }
  joint_max_velocities: {
    type: double_array,
    default_value: [],
    description: "Specifies maximum joint velocities in rad/s or m/s. These should be obtained via experimentation since it depends on how much weight each motor is moving.",
    read_only: true,
    validation: {
      not_empty<>: null,
    }
  }
  virtual_four_bar_coupling_ratio: {
    type: double,
    default_value: -1.0,
    description: "Virtual four-bar ratio applied as elbow_motor_velocity += ratio * shoulder_motor_velocity.",
    read_only: true,
  }
  # Controller: Airbus TCA Sidestick
  # Buttons: [1] center button  [2] elbow modifier  [3] red button  [4] left 1 (gripper open)  [5] left 2 (gripper close)
  # Axes:    [0] joystick_y  [1] joystick_x  ([2][3][4][5] unused)
  # Modes:   default=base yaw+shoulder  wrist(buttons[1])=wrist roll+pitch  elbow(buttons[2])=elbow pitch
  controls:
    modifier_button:       { type: int, default_value: 1, description: "Button index for wrist mode modifier.", read_only: true }             # Airbus: [button 1] center button
    elbow_modifier_button: { type: int, default_value: 2, description: "Button index for elbow mode modifier.", read_only: true }             # Airbus: [button 2]
    actuator_button:       { type: int, default_value: 3, description: "Button index for actuator trigger.", read_only: true }                # Airbus: [button 3] red button
    gripper_open_button:   { type: int, default_value: 4, description: "Button index for gripper open.", read_only: true }                   # Airbus: [button 4] left 1
    gripper_close_button:  { type: int, default_value: 5, description: "Button index for gripper close.", read_only: true }                  # Airbus: [button 5] left 2
    base_yaw_axis:         { type: int, default_value: 0, description: "Axis index for base yaw / wrist roll.", read_only: true }            # Airbus: [axis 0] joystick_y
    shoulder_pitch_axis:   { type: int, default_value: 1, description: "Axis index for shoulder / wrist pitch / elbow pitch.", read_only: true }  # Airbus: [axis 1] joystick_x
