manual_arm_joint_by_joint_controller:
  position_joints: {
    type: string_array,
    default_value: [],
    description: "Specifies joints which are controlled via position.",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  velocity_joints: {
    type: string_array,
    default_value: [],
    description: "Specifies joints which are controlled via velocity.",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  # state_joints: {
  #   type: string_array,
  #   default_value: [],
  #   description: "(optional) Specifies joints for reading states. This parameter is only relevant when state joints are different then command joint, i.e., when a following controller is used.",
  #   read_only: true,
  #   validation: {
  #     unique<>: null,
  #   }
  # }
  # interface_name: {
  #   type: string,
  #   default_value: "",
  #   description: "Name of the interface used by the controller on joints and command_joints.",
  #   read_only: true,
  #   validation: {
  #     not_empty<>: null,
  #     one_of<>: [["position", "velocity", "acceleration", "effort",]],
  #     forbidden_interface_name_prefix: null
  #   }
  # }
  joystick_topic: {
    type: string,
    default_value: "controller_input/xbox",
    description: "Topic name for joystick input (sensor_msgs/Joy).",
    read_only: true,
    validation: {
      not_empty<>: null,
    }
  }
  joint_max_velocities: {
    type: double_array,
    default_value: [],
    description: "Specifies maximum joint velocities in rad/s or m/s. These should be obtained via experimentation since it depends on how much weight each motor is moving.",
    read_only: true,
    validation: {
      not_empty<>: null,
    }
  }
  virtual_four_bar_coupling_ratio: {
    type: double,
    default_value: -1.0,
    description: "Virtual four-bar ratio applied as elbow_motor_velocity += ratio * shoulder_motor_velocity.",
    read_only: true,
  }
  # Controller: Xbox
  # Buttons: [1] B (wrist mod)  [2] X (actuator)  [4] LB (gripper open)  [5] RB (gripper close)
  # Axes:    [0] left_stick_lr  [1] left_stick_ud  [3] right_stick_ud  [4] left_trigger  [5] right_trigger
  # Modes:   default=base yaw+shoulder  wrist(buttons[1])=wrist roll+pitch  elbow=always on right stick
  controls:
    modifier_button:      { type: int, default_value: 1, description: "Button index for wrist mode modifier.", read_only: true }             # Xbox: B
    actuator_button:      { type: int, default_value: 2, description: "Button index for actuator trigger.", read_only: true }               # Xbox: X
    gripper_open_button:  { type: int, default_value: 4, description: "Button index for gripper open (full speed).", read_only: true }      # Xbox: LB
    gripper_close_button: { type: int, default_value: 5, description: "Button index for gripper close (full speed).", read_only: true }     # Xbox: RB
    base_yaw_axis:        { type: int, default_value: 0, description: "Axis index for base yaw / wrist roll.", read_only: true }            # Xbox: left_stick_lr
    shoulder_pitch_axis:  { type: int, default_value: 1, description: "Axis index for shoulder pitch / wrist pitch.", read_only: true }     # Xbox: left_stick_ud
    elbow_pitch_axis:     { type: int, default_value: 3, description: "Axis index for elbow pitch (always active).", read_only: true }      # Xbox: right_stick_ud
    gripper_open_axis:    { type: int, default_value: 4, description: "Axis index for gripper open (analog fallback).", read_only: true }   # Xbox: left_trigger
    gripper_close_axis:   { type: int, default_value: 5, description: "Axis index for gripper close (analog fallback).", read_only: true }  # Xbox: right_trigger
